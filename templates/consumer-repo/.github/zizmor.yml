# zizmor（workflow 安全檢查）的設定 —— 公版 security-reusable 的 run-zizmor 開著時會讀這份。
# 這是你專案自己的檔案，公版的一鍵導入不會覆蓋它；要放行某條規則就加在這裡。
# 寫法：https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # 公版刻意用「會移動的 v1」讓所有專案自動跟版（見公版 README「版本策略」），
        # 所以指向公版的 uses: 只要求有釘 tag（ref-pin），不要求釘 SHA。
        # 搬到組織之後把 owner 改掉（adopt.sh --uses-repo 會順手改）。
        "singi0771/ci-standards/*": ref-pin
        # 其他所有第三方 action 一律要釘 commit SHA
        "*": hash-pin

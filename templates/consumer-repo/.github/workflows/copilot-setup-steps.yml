# 預先設定 Copilot Coding Agent 的執行環境（Python + Docker）
# 檔名 / job 名固定為 copilot-setup-steps，Copilot cloud agent 動工前會先跑這支，
# 把相依套件裝好，讓它能真的跑起你的測試再開 PR。
name: Copilot Setup Steps

on: workflow_dispatch

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 這裡只裝套件，不需要把 token 留在磁碟上
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          pip install "ruff==0.16.0" pytest   # 與 ci-reusable 的釘版本一致
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

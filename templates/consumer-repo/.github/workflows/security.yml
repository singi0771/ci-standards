# 各專案的「呼叫端」workflow —— 只有這一小段，邏輯全在中央公版。
# 中央公版更新後，這裡指向 @v2 的 repo 全部自動跟進。
# ⚠️ 中央公版在 singi0771/ci-standards；@v2 是版本 tag（要最新可改 @main）。
name: Security Scan

on:
  # 只在「PR 發到正式分支」時掃描，合併後不再重跑（理由與 branches 的改法見 ci.yml）。
  # 程式沒動、但新公布的 CVE 由下面的 schedule 每週重掃抓。
  # ⚠️ pull_request 這裡「不要」加 paths-ignore —— 理由同 ci.yml：
  # `security / Security Gate` 是 required check，被 path filter 擋掉就永遠不回報，
  # 純文件 PR 會卡死在 pending。
  # 多列 ready_for_review 是為了讓「草稿 PR 不跑、改成正式 PR 那一刻才跑」能運作（見 jobs 的 if）。
  # 多列 edited（2.6.0 起）：PR 先發到 develop（不跑）再把 base 改成正式分支時，要在這時候掃描，
  # 否則 Security Gate 永遠不回報。改標題、改內文的 edited 不重跑（見 jobs 的 if 與 concurrency）。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: "0 3 * * 1"        # 每週一完整重掃，抓「程式沒動但新公布的 CVE」；想省分鐘可改每月

# 呼叫端也要宣告最小權限，不然 reusable 拿到的是 repo 預設 token 權限
permissions:
  contents: read

# 排程重掃跟 PR 分開一組 —— 兩者共用一組的話，會互相取消，被取消的那一輪 Security Gate 是紅的。
# 改標題／內文的 edited 不跑任何 job，給它獨立的 group（每次都不同），免得取消同一個 PR 正在跑的掃描。
concurrency:
  group: ${{ github.event.action == 'edited' && github.event.changes.base == null && format('security-edit-{0}', github.run_id) || format('security-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  security:
    # 草稿 PR 先不跑（草稿本來就不能 merge），省 Actions 分鐘；
    # edited 事件只有在 base 分支被改掉時才跑
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    uses: singi0771/ci-standards/.github/workflows/security-reusable.yml@v2
    with:
      severity: "CRITICAL,HIGH"
      fail-on-findings: true
      # 範本預設 false（與公版預設一致）。有 Dockerfile 才改成 true ——
      # 沒有 Dockerfile 時公版會快速略過；關掉可省去安裝 trivy 與找 Dockerfile 的幾秒。
      scan-docker-image: false
      # workflow 本身的安全檢查（腳本注入、權限過大、沒釘 SHA 的 action…），規則在 .github/zizmor.yml
      run-zizmor: true
      # generate-sbom: true      # 要留一份「這版用了哪些套件」的清單（CycloneDX）時打開
      # trivy-scanners: "vuln,misconfig,license"   # 要一起查授權條款時加 license

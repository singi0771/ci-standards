# 各專案的「呼叫端」workflow — 只有這一小段，邏輯全在中央公版。
# 中央公版更新後，這裡指向 @v1 的 repo 全部自動跟進。
# ⚠️ 中央公版在 singi0771/ci-standards；@v1 是版本 tag（要最新可改 @main）。
name: Security Scan

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  # ⚠️ pull_request 這裡「不要」加 paths-ignore —— 理由同 ci.yml：
  # `security / Security Gate` 是 required check，被 path filter 擋掉就永遠不回報，
  # 純文件 PR 會卡死在 pending。
  pull_request:
  schedule:
    - cron: "0 3 * * 1"        # 每週一完整重掃

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: singi0771/ci-standards/.github/workflows/security-reusable.yml@v1
    with:
      python-version: "3.12"
      severity: "CRITICAL,HIGH"
      fail-on-findings: true
      # 範本預設 false（與公版預設一致）。有 Dockerfile 才改成 true ——
      # 沒有 Dockerfile 時公版雖然會快速略過，但仍會起一個 job 白吃 Actions 分鐘。
      scan-docker-image: false
      upload-sarif: false        # private 且無 GHAS → 保持 false；若改 public 可設 true

# 各專案的「呼叫端」CI workflow —— 邏輯全在中央公版。
# ⚠️ 中央公版在 singi0771/ci-standards；@v2 是版本 tag（要最新可改 @main）。
#
# ── 選配：PR 來源分支政策（走 develop / GitFlow 這類流程時才需要）────────────
# 公版不預設任何分支模型，分支名稱完全由你決定。要限制「誰可以 merge 進哪裡」，
# 在下面 jobs.ci.with 加這兩個 input（不加＝不檢查）：
#
#     restricted-base-branches: "main"              # 要管的 base，空白隔開，支援 glob
#     allowed-head-branches: "develop hotfix/* dependabot/*"   # 允許的來源分支
#
# 這組的意思是「main 只接受從 develop、hotfix/*、dependabot/* 發來的 PR」，其他分支發到 main 會被擋下。
# dependabot/*：Dependabot 資安更新不看 target-branch，固定發到預設分支；不放行的話這類 PR 永遠紅燈。
# 檢查結果收進 `ci / CI Gate`，所以分支保護的 ruleset 不必加新的 required check。
# ⚠️ 它擋的是誤操作。repo 能設分支保護時，要跟 ruleset（必須開 PR、禁止 force push）一起設；
#    不能設分支保護的 repo（例如 Free 方案的 private repo），紅燈只能提醒、擋不住 merge。
name: CI

on:
  # 只在「PR 發到正式分支」時檢查（2.6.0 起）。合併後不再重跑，功能分支發到 develop 的 PR 也不跑：
  #   - 私有 repo 的 Actions 每個 job 不滿一分鐘也算一分鐘，同一帳號的私有 repo 共用額度
  #     （公版 docs/ACTIONS-MINUTES.md）。每個功能 PR 都檢查，額度消耗得很快。
  #   - develop → 正式分支的發版 PR 檢查的是「合併後的結果」（refs/pull/N/merge），
  #     develop 累積的所有變更在這裡一次驗過；hotfix/* → 正式分支、Dependabot 資安更新也在這裡驗。
  #   - 代價：develop 上的問題要到發版 PR 才會出現，發版前最好先在本機跑過 lint 與測試。
  #   - 直接 push、Gate 沒綠就 merge 正式分支，由 branch-guard.yml 偵測並開 Issue 通知
  # branches 由導入腳本填成正式分支。想讓每個 PR 都檢查（包含發到 develop 的），改成 branches: ['**']
  # （導入腳本看到已有 branches 就不會改回來）。
  # ⚠️ 沒列在 branches 的分支，其 PR 不會有 `ci / CI Gate` —— 那些分支的分支保護不能要求這個 check，
  #   develop 的 ruleset 用 REQUIRED_CHECKS=none 設定（見公版 README「develop 流程設定」）。
  # ⚠️ synchronize 只在「來源分支」有新 commit 時觸發；「目標分支」有新 commit 不會重跑。
  #   要擋就用分支保護的「Require branches to be up to date」（setup-branch-protection.sh 的 STRICT_CHECKS=true）。
  # ⚠️ pull_request 這裡「不要」加 paths-ignore。
  # 分支保護把 `ci / CI Gate` 設成 required check 後，被 path filter 擋掉的 PR
  # 根本不會啟動 workflow → required check 永遠 pending → 純文件 PR 永遠 merge 不了
  # （連 admin 都不行，ruleset 沒有例外名單）。省那幾分鐘不值得換一個卡死。
  # 多列 ready_for_review 是為了讓「草稿 PR 不跑、改成正式 PR 那一刻才跑」能運作（見 jobs 的 if）。
  # 多列 edited 是為了「PR 改了 base 分支」時重跑：先發到 develop（不跑）再把 base 改成正式分支時，
  # 要在這時候檢查；也避免先拿到綠燈再改 base 繞過來源分支政策。改標題、改內文也是 edited，
  # 那種不重跑（見 jobs 的 if 與 concurrency）。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

# 呼叫端也要宣告最小權限，不然 reusable 拿到的是 repo 預設 token 權限
permissions:
  contents: read

# 改標題／內文的 edited 不跑任何 job，給它獨立的 group（每次都不同）：否則它會把同一個 PR
# 正在跑的 CI 取消掉，而自己又什麼都不跑，這個 commit 就永遠沒有 CI Gate 結果。改 base 的 edited 照常共用 group。
concurrency:
  group: ${{ github.event.action == 'edited' && github.event.changes.base == null && format('ci-edit-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  ci:
    # 草稿 PR 先不跑（草稿本來就不能 merge），省 Actions 分鐘；
    # edited 事件只有在 base 分支被改掉時才跑
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    uses: singi0771/ci-standards/.github/workflows/ci-reusable.yml@v2
    with:
      # 語言相關的檢查預設都是關的，用到哪個開哪個（adopt.sh 會依偵測結果填好）
      run-python: true
      python-version: "3.12"
      # run-dotnet: true           # C# / .NET 專案打開；有多個 .sln 時再加 dotnet-project: "src/App.sln"
      run-docker-build: true
      run-hadolint: true         # 有 Dockerfile 才有作用：build 之前先檢查 Dockerfile 寫法

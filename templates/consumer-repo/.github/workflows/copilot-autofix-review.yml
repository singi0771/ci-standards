# 薄殼：Copilot（或人）送出 changes_requested → 呼叫公版讓 Copilot 依意見自動修。
# 邏輯全在中央公版；改邏輯只要移動 @v1，本檔幾乎不需再動。
# ⚠️ 中央公版在 singi0771/ci-standards；@v1 是版本 tag（要最新可改 @main）。
name: Copilot Autofix — Review

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  autofix-review:
    # review 要求變更、且非 Dependabot PR 才呼叫公版
    if: >
      github.event.review.state == 'changes_requested' &&
      !contains(github.event.pull_request.user.login, 'dependabot')
    uses: singi0771/ci-standards/.github/workflows/copilot-autofix-review-reusable.yml@v1
    with:
      pr-number:   ${{ github.event.pull_request.number }}
      pr-author:   ${{ github.event.pull_request.user.login }}
      reviewer:    ${{ github.event.review.user.login }}
      review-body: ${{ github.event.review.body }}
      review-url:  ${{ github.event.review.html_url }}
      # max-attempts: "3"   # 要調整依 review 自動修正次數上限時取消註解

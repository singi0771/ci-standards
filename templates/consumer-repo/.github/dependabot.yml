# Dependabot（原生免費）— 已對準 Python + Docker 專案
version: 2

updates:
  - package-ecosystem: "pip"
    cooldown:
      # 供應鏈防護：剛發布的版本先觀察幾天再更新，避免搶到被投毒的新版。
      # 只用 default-days —— semver-major-days 等細分選項不是每個 ecosystem 都支援
      # （github-actions 就會被 Dependabot 判為 invalid config），統一用最低共通分母。
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]   # 小版本併一個 PR，major 單獨開

  - package-ecosystem: "docker"
    cooldown:
      # 供應鏈防護：剛發布的版本先觀察幾天再更新，避免搶到被投毒的新版。
      # 只用 default-days —— semver-major-days 等細分選項不是每個 ecosystem 都支援
      # （github-actions 就會被 Dependabot 判為 invalid config），統一用最低共通分母。
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    cooldown:
      # 供應鏈防護：剛發布的版本先觀察幾天再更新，避免搶到被投毒的新版。
      # 只用 default-days —— semver-major-days 等細分選項不是每個 ecosystem 都支援
      # （github-actions 就會被 Dependabot 判為 invalid config），統一用最低共通分母。
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]

# 若之後加了前端（Node），再補一段 npm 的區塊即可。

# zizmor（workflow 安全檢查）的設定。本 repo 自己的 Security Scan 有開 run-zizmor。
# zizmor 從 repo 根目錄掃，會連 templates/consumer-repo/.github/workflows 一起掃到，
# 所以這裡的規則兩邊都適用（ignore 是比對檔名，不分目錄）。
rules:
  unpinned-uses:
    config:
      policies:
        # 公版刻意用「會移動的 v1」讓所有專案自動跟版（見 README「版本策略」）。
        # 這是有意的取捨：不可變的 vX.Y.Z tag 是還原點，SECURITY.md 有寫明風險。
        # 所以指向本公版的 uses: 只要求有釘 tag / branch（ref-pin），不要求釘 SHA。
        "singi0771/ci-standards/*": ref-pin
        # 其他所有第三方 action 一律要釘 commit SHA
        "*": hash-pin
  self-repository:
    # 本 repo 的呼叫端刻意用 `uses: ./...` 呼叫自己的 reusable（公版拿自己當第一個使用者：PR 上跑的
    # 才會是「這個 PR 的版本」）。zizmor 建議改用 2026 年 7 月才推出的 `uses: $/...` 新語法，
    # 但 actionlint 與 adopt.sh 都還不認得它，先維持 `./`，等工具跟上再換。
    disable: true

# 本 repo 自己的 CI —— 公版對自己也要適用（公版拿自己當第一個使用者）。
# 用 ./ 呼叫本 repo 的 reusable：PR 會用「這個 PR 的版本」跑，
# 不是 @v1。改壞公版時當場就會紅，不會等到別人的專案才爆。
name: CI

on:
  # push 觸發：列出「合併後要再驗一次」的長壽分支。
  # GitHub 的 on: 不吃 ${{ }} 運算式，這裡只能寫死分支名 ——
  # 用什麼分支模型是各專案自己的事，改這一行即可（例如只有 main、或 main + develop）。
  push:
    branches: [main, develop]
    paths-ignore: ["**/*.md", "docs/**"]
  # pull_request 不加 paths-ignore —— 見 ci-reusable 的 CI Gate 說明。
  # 多列 ready_for_review：草稿 PR 不跑（見下面 job 的 if），改成正式 PR 那一刻才跑，省分鐘。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼叫端也要宣告最小權限；沒寫的話 reusable 拿到的是 repo 預設 token 權限（zizmor: excessive-permissions）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 草稿 PR 先不跑，反正草稿本來就不能 merge；標成 ready for review 會再觸發一次
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-reusable.yml
    with:
      # 本 repo 沒有 Python、沒有 Dockerfile，真正要檢查的是 workflow 與 shell script
      run-python: false
      run-docker-build: false
      run-actionlint: true
      run-shellcheck: true
      # 除了本 repo 的 .github/workflows，consumer 範本也要一起檢查 ——
      # 範本壞掉的話，每個照著導入的專案都會壞
      actionlint-paths: "templates/consumer-repo/.github/workflows/*.yml"
      # 本 repo 走 develop 流程：功能分支只能發 PR 到 develop，main 只收 develop 的 PR。
      # 這兩個 input 是選配的，不填就不檢查 —— 公版不預設任何分支模型。
      restricted-base-branches: "main"
      allowed-head-branches: "develop"

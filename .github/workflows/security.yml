name: Security Scan
on:
  pull_request:
  schedule:
    - cron: "30 19 * * 3"        # 這個專案自己調過的排程，必須保留
jobs:
  security:
    uses: singi0771/ci-standards/.github/workflows/security-reusable.yml@v1.1.0
    with:
      python-version: "3.9"
      severity: "CRITICAL,HIGH,MEDIUM"
      fail-on-findings: false
      scan-docker-image: true

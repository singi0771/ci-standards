# 本 repo 自己的呼叫端 workflow：CI/Security 失敗 → 讓 Copilot 自動修。
# 用 ./ 呼叫本 repo 的公版。注意 workflow_run 觸發器只認 default branch 上的檔案，
# 所以這支要合併進 main 之後才會生效。
#
# ⚠️ 需要 repo secret `COPILOT_TRIGGER_PAT`——@copilot mention 必須由真人帳號發出，
#    bot 發的會被 coding agent 忽略；沒設的話這條路只會貼留言、不會有人修。
name: Copilot Autofix — CI/Security

on:
  workflow_run:
    workflows: ["CI", "Security Scan"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write     # 達上限時貼 needs-human-review label 用
  contents: read
  actions: read

jobs:
  autofix:
    # 只處理「PR 觸發」的失敗。推到 main 或每週排程的失敗沒有 PR 可修，
    # 以前也會起一個 job 跑進去才發現沒 PR 而跳過 —— 多付一分鐘。
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    uses: ./.github/workflows/copilot-autofix-reusable.yml
    with:
      head-branch:   ${{ github.event.workflow_run.head_branch }}
      workflow-name: ${{ github.event.workflow_run.name }}
      run-id:        ${{ github.event.workflow_run.id }}
      run-url:       ${{ github.event.workflow_run.html_url }}
    secrets:
      copilot-trigger-pat: ${{ secrets.COPILOT_TRIGGER_PAT }}

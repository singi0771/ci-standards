# 中央公版：CI Reusable Workflow（Python / .NET + Docker + workflow / shell lint）
# 各專案用一行 uses: 呼叫；統一 lint + test + Docker build 檢查。
#
# 語言相關的 job（Python、.NET）一律預設「關」，由呼叫端（或 adopt.sh 的偵測結果）明確打開 ——
# 公版不假設專案用什麼語言。語言無關的檢查（Docker、actionlint、shellcheck）也是各自開關。
#
# 省 Actions 分鐘的設計（GitHub 每個 job 都是「不滿一分鐘也算一分鐘」）：
#   - actionlint 與 shellcheck 合成一個 job（兩個加起來不到 30 秒，拆兩個 job 多付一分鐘）
#   - hadolint 放在 Docker build 那個 job 裡當一個步驟，不另開 job
#   - actionlint 改抓 2 MB 的執行檔，不再拉 docker image（省 20–40 秒）
name: Reusable CI

on:
  workflow_call:
    inputs:
      run-python:
        description: "是否跑 Python lint + test（2.0.0 起預設關，Python 專案要明確設 true）"
        type: boolean
        default: false
      python-version:
        type: string
        default: "3.12"
      ruff-version:
        description: "釘死的 ruff 版本，避免 lint 結果隨新版 ruff 漂移（要升級在這裡改）"
        type: string
        default: "0.16.0"
      run-dotnet:
        description: "是否跑 .NET（C# / F#）的 restore + build + test"
        type: boolean
        default: false
      dotnet-version:
        description: >-
          .NET SDK 版本（例如 8.0.x，多個用換行隔開）。留空＝有 global.json 就照它；
          沒有就依專案檔的 TargetFramework(s) 把用到的版本都裝起來；連那個都找不到才用 10.0.x（目前的 LTS）
        type: string
        default: ""
      dotnet-project:
        description: >-
          要建置的 .sln / .slnx / .csproj 路徑。留空＝自動找（repo 裡只有一個方案檔時才找得到，
          有好幾個就會要求你明確指定）
        type: string
        default: ""
      run-dotnet-format:
        description: "是否用 dotnet format --verify-no-changes 檢查程式碼格式與 analyzer 規則（等同 Python 那邊的 ruff）"
        type: boolean
        default: true
      dotnet-runner:
        description: >-
          .NET job 跑在哪種 runner。WPF / WinForms / .NET Framework 這類只能在 Windows 建置的專案設 windows-latest
          （Windows runner 的分鐘數算 2 倍）
        type: string
        default: "ubuntu-latest"
      run-docker-build:
        description: "是否驗證 Docker image 能建置"
        type: boolean
        default: true
      dockerfile:
        description: >-
          要檢查的 Dockerfile（相對 repo 根目錄），例如 src/Web.Api/Dockerfile；多個用空白隔開，
          每一項也可以寫成 <路徑>:<build context>。留空＝自動找全 repo 的 Dockerfile、*.Dockerfile、Dockerfile.*。
          1.4.0 的單一路徑寫法照樣能用。hadolint 與 Docker build 都用它
        type: string
        default: ""
      docker-context:
        description: "docker build 的 context 目錄（相對 repo 根目錄），dockerfile 那一項沒寫 :<context> 時用它"
        type: string
        default: "."
      run-hadolint:
        description: "build 之前是否先用 hadolint 檢查 Dockerfile 寫法（要 run-docker-build 開著才有作用）"
        type: boolean
        default: false
      run-actionlint:
        description: "是否檢查 GitHub Actions workflow 語法（會連 run: 區塊裡的 bash 一起用 shellcheck 檢查）"
        type: boolean
        default: false
      run-shellcheck:
        description: "是否用 shellcheck 檢查 shell script"
        type: boolean
        default: false
      shellcheck-paths:
        description: "要檢查的 shell script glob（空字串＝自動找全 repo 的 *.sh）"
        type: string
        default: ""
      actionlint-paths:
        description: "額外要檢查的 workflow 檔（空字串＝只檢查本 repo 的 .github/workflows）"
        type: string
        default: ""
      restricted-base-branches:
        description: >-
          要管制「誰可以 merge 進來」的 base 分支，空白隔開，支援 glob（例如 main、或 main release/*）。
          留空＝不做這項檢查。公版刻意不寫死任何分支名稱，用什麼分支模型由各專案自己決定。
        type: string
        default: ""
      allowed-head-branches:
        description: >-
          承上，允許合併進那些 base 的來源分支，空白隔開，支援 glob（例如 develop、或 develop hotfix/*）。
          只有 restricted-base-branches 有值時才會用到；那時這個留空＝擋掉全部，視為設定錯誤。
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.run-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 這個 job 不會推東西回 repo，不要把 token 留在磁碟上（zizmor: artipacked）
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          # 只有找得到相依清單時才開 pip 快取 —— setup-python 開了快取卻找不到 requirements*.txt /
          # pyproject.toml 會直接失敗（只有 .py 檔、還沒有相依清單的專案就是這樣）
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
      - name: Install deps
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          # ruff 釘版本：不釘的話新版 ruff 會憑空多出 lint 規則，讓沒改程式的 repo 突然變紅
          # （runner 的 pip 已經夠新，不必再花 10 秒 upgrade pip）
          pip install "ruff==$RUFF_VERSION" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # pyproject.toml 只放 ruff / pytest 設定（沒有 [project] 或 [build-system]）時，
          # 它不是一個可安裝的套件，pip install -e . 一定失敗 —— 那種情況就不裝。
          # 真的是套件卻裝不起來，要讓這一步紅，不能像舊版用 `|| true` 吞掉，
          # 否則後面 pytest 只會噴一堆看不懂的 ImportError。
          if [ -f pyproject.toml ] && grep -qE '^\[(project|build-system)\]' pyproject.toml; then
            pip install -e .
          fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: |
          set +e
          pytest -q
          EXIT=$?
          set -e
          # pytest 的 exit 5 = 「沒收集到任何測試」。還沒開始寫測試的專案不該因此
          # 永遠紅著（那只會逼人把 CI 關掉）。真正的測試失敗是 exit 1，照樣擋。
          if [ "$EXIT" -eq 5 ]; then
            echo "⚠️  沒有找到任何測試 —— 通過，但這個專案應該補上測試。"
            echo "⚠️ 沒有任何測試" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXIT" -ne 0 ]; then
            exit "$EXIT"
          fi

  dotnet:
    name: .NET build + test
    runs-on: ${{ inputs.dotnet-runner }}
    timeout-minutes: 20
    if: ${{ inputs.run-dotnet }}
    # Windows runner 的預設 shell 是 pwsh；統一用 bash（Windows 上是 Git Bash），兩邊同一份腳本
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 決定 SDK 版本與要建置的方案
        id: plan
        env:
          DOTNET_VERSION: ${{ inputs.dotnet-version }}
          PROJECT: ${{ inputs.dotnet-project }}
        run: |
          # SDK 版本：呼叫端指定 > global.json > 專案檔裡的 TargetFramework(s)。
          # 第三種要把「每個用到的版本」都裝起來：SDK 10 可以建置 net8.0，但測試要在 8.0 的 runtime 上跑，
          # 只裝 10 的話 dotnet test 會因為找不到 Microsoft.NETCore.App 8.0 而失敗。
          # 一律用 <<EOF 的多行寫法：dotnet-version 可以是換行隔開的好幾個版本，
          # 用 version=... 單行寫法的話，第二行會讓 runner 判定 GITHUB_OUTPUT 格式錯誤
          if [ -n "$DOTNET_VERSION" ]; then
            { echo "version<<EOF"; echo "$DOTNET_VERSION"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          elif [ -f global.json ]; then
            echo "global-json=global.json" >> "$GITHUB_OUTPUT"
          else
            # net8.0 / net9.0-windows / netcoreapp3.1 → 8.0.x / 9.0.x / 3.1.x；net48 這類 .NET Framework 不需要裝 SDK
            TFMS="$(find . \( -path ./.git -o -name node_modules -o -name bin -o -name obj \) -prune -o -type f \
                \( -name '*.csproj' -o -name '*.fsproj' -o -name '*.vbproj' -o -name 'Directory.Build.props' \) -print0 \
              | xargs -0 -r grep -ohE '<TargetFrameworks?>[^<]+' \
              | sed 's/<TargetFrameworks\{0,1\}>//' | tr ';' '\n' \
              | sed -nE 's/^[[:space:]]*net(coreapp)?([0-9]+\.[0-9]+).*$/\2.x/p' | sort -uV || true)"
            # ↑ || true：這個 job 用 shell: bash（含 pipefail），一個 TargetFramework 都沒找到時
            #   grep 會讓整條管線非零 → 步驟直接死掉，下面的 10.0.x 退路就永遠走不到
            if [ -z "$TFMS" ]; then TFMS="10.0.x"; fi
            echo "→ 依 TargetFramework 安裝 SDK：$(echo "$TFMS" | tr '\n' ' ')"
            { echo "version<<EOF"; echo "$TFMS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$PROJECT" ]; then
            # 先找方案檔（.sln / .slnx），沒有才找單一專案檔。找到兩個以上就不猜 ——
            # 猜錯的話「CI 綠」只代表其中一個方案建得起來，那是假綠燈。
            mapfile -t CANDS < <(find . \( -path ./.git -o -name node_modules -o -name bin -o -name obj \) -prune \
              -o -type f \( -name '*.sln' -o -name '*.slnx' \) -print | sort)
            if [ "${#CANDS[@]}" -eq 0 ]; then
              mapfile -t CANDS < <(find . \( -path ./.git -o -name node_modules -o -name bin -o -name obj \) -prune \
                -o -type f \( -name '*.csproj' -o -name '*.fsproj' -o -name '*.vbproj' \) -print | sort)
            fi
            if [ "${#CANDS[@]}" -ne 1 ]; then
              echo "::error::找到 ${#CANDS[@]} 個方案 / 專案檔，無法自動決定要建置哪一個。請在呼叫端設定 dotnet-project。"
              printf '  %s\n' "${CANDS[@]}"
              exit 1
            fi
            PROJECT="${CANDS[0]}"
          elif [ ! -e "$PROJECT" ]; then
            echo "::error::dotnet-project 指的 $PROJECT 不存在"
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "→ 建置目標：$PROJECT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.plan.outputs.version }}
          global-json-file: ${{ steps.plan.outputs.global-json }}
          # 有 packages.lock.json 才能開快取（setup-dotnet 找不到 lock 檔會直接失敗）
          cache: ${{ hashFiles('**/packages.lock.json') != '' }}
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        env:
          PROJECT: ${{ steps.plan.outputs.project }}
        run: dotnet restore "$PROJECT"
      - name: Format / analyzers (dotnet format)
        if: ${{ inputs.run-dotnet-format }}
        env:
          PROJECT: ${{ steps.plan.outputs.project }}
        run: |
          # 規則讀專案的 .editorconfig。舊專案第一次導入可能整片紅 ——
          # 先 run-dotnet-format: false 過渡，在本機跑一次 dotnet format 整理完再打開。
          dotnet format "$PROJECT" --verify-no-changes --no-restore
      - name: Build
        env:
          PROJECT: ${{ steps.plan.outputs.project }}
        run: dotnet build "$PROJECT" --no-restore --configuration Release
      - name: Test
        env:
          PROJECT: ${{ steps.plan.outputs.project }}
        # 方案裡沒有任何測試專案時，dotnet test 什麼都不做、回 0 —— 跟 Python 那邊一樣不擋
        run: dotnet test "$PROJECT" --no-build --configuration Release

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.run-docker-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 找出要檢查的 Dockerfile
        env:
          DOCKERFILES: ${{ inputs.dockerfile }}
        run: |
          LIST="$RUNNER_TEMP/dockerfiles.txt"
          if [ -n "$DOCKERFILES" ]; then
            # 呼叫端明確列出的：一項一行，不做 glob 展開
            set -f
            for d in $DOCKERFILES; do printf '%s\n' "$d"; done > "$LIST"
            set +f
          else
            # 舊版只看根目錄的 Dockerfile，monorepo 子目錄裡的完全沒被檢查到
            find . \( -path ./.git -o -name node_modules \) -prune -o -type f \
              \( -name Dockerfile -o -name '*.Dockerfile' -o -name 'Dockerfile.*' \) \
              ! -name '*.dockerignore' -print | sed 's|^\./||' | sort > "$LIST"
          fi
          if [ ! -s "$LIST" ]; then echo "沒有 Dockerfile，略過"; exit 0; fi
          echo "要檢查的 Dockerfile："; sed 's/^/  /' "$LIST"
          # 1.4.0 的預設值是 "Dockerfile"（根目錄沒有就略過）；照抄這個值的呼叫端維持同樣行為。
          # 清空清單（讓後面的 hadolint / build 略過）要在下面的迴圈外做 —— 邊讀邊寫同一個檔是 SC2094
          if [ "$DOCKERFILES" = "Dockerfile" ] && [ ! -f Dockerfile ]; then
            echo "沒有 Dockerfile，略過"; : > "$LIST"; exit 0
          fi
          while IFS= read -r entry; do
            f="${entry%%:*}"
            if [ ! -f "$f" ]; then
              # 其他明確指定的路徑找不到＝多半打錯字，要吵（不能讓檢查被靜靜略過）
              echo "::error::dockerfile input 指定的 $f 不存在（路徑打錯？）"; exit 1
            fi
          done < "$LIST"
      # hadolint：檢查 Dockerfile 的寫法（沒釘版本的 apt 套件、用 latest tag、
      # RUN 裡的 shell 問題…）。Trivy 的 misconfig 只抓「會出資安問題」的那幾條，
      # hadolint 抓得更廣。放在 build 前面：Dockerfile 寫壞了不必等 build 跑完才知道。
      - name: Dockerfile lint (hadolint)
        if: ${{ inputs.run-hadolint }}
        run: |
          LIST="$RUNNER_TEMP/dockerfiles.txt"
          if [ ! -s "$LIST" ]; then echo "沒有 Dockerfile，略過"; exit 0; fi
          # 版本 + sha256 一起釘，升版時到 release 的 checksums.sha256 重抓：
          # https://github.com/hadolint/hadolint/releases
          VERSION="2.15.1"
          SHA256="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
          curl --fail -sSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/hadolint-linux-x86_64"
          echo "${SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint && sudo mv hadolint /usr/local/bin/hadolint
          hadolint --version
          # warning 以上才算失敗；info / style 只印出來。要忽略某條規則放 .hadolint.yaml 在專案根目錄。
          FAIL=0
          while IFS= read -r entry; do
            f="${entry%%:*}"
            echo "── hadolint $f"
            hadolint --failure-threshold warning "$f" || FAIL=1
          done < "$LIST"
          exit "$FAIL"
      - name: Build image (不推送，只驗證能 build)
        env:
          # 一律先過 env 再進 shell，不要把 ${{ }} 直接塞進 run: 字串（shell injection）
          SHA: ${{ github.sha }}
          DOCKER_CONTEXT: ${{ inputs.docker-context }}
        run: |
          LIST="$RUNNER_TEMP/dockerfiles.txt"
          if [ ! -s "$LIST" ]; then echo "沒有 Dockerfile，略過"; exit 0; fi
          n=0
          while IFS= read -r entry; do
            n=$((n+1))
            f="${entry%%:*}"
            # context：那一項有寫 :<context> 就用它，否則用 docker-context（預設 repo 根目錄，
            # 跟 Visual Studio / docker-compose 產生的 .NET Dockerfile 慣例一致）
            if [ "$entry" != "$f" ]; then ctx="${entry#*:}"; else ctx="$DOCKER_CONTEXT"; fi
            echo "── docker build -f $f $ctx"
            docker build -f "$f" -t "ci-check-$n:$SHA" "$ctx"
          done < "$LIST"

  # workflow 語法 + shell script 檢查，合在一個 job（見檔頭「省分鐘」說明）。
  # actionlint 會自動呼叫 PATH 上的 shellcheck 去檢查 run: 區塊，ubuntu runner 內建 shellcheck，
  # 所以不必再拉 docker image。
  lint:
    name: Workflow + shell lint (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.run-actionlint || inputs.run-shellcheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        if: ${{ inputs.run-actionlint }}
        env:
          EXTRA_PATHS: ${{ inputs.actionlint-paths }}
        run: |
          # 版本 + sha256 一起釘，理由同其他工具：latest 升版會新增規則，沒改程式也可能突然變紅。
          # 升版時到 release 的 actionlint_<版本>_checksums.txt 重抓：https://github.com/rhysd/actionlint/releases
          VERSION="1.7.12"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version | head -2

          # 不帶檔案參數時 actionlint 會自動掃 .github/workflows；
          # 一旦給了檔案參數就「只」檢查那些檔案，所以額外路徑必須分開跑一次。
          actionlint -color

          if [ -n "$EXTRA_PATHS" ]; then
            # shellcheck disable=SC2086  # 要讓 glob / 多路徑展開成多個參數
            actionlint -color $EXTRA_PATHS
          fi
      - name: Run shellcheck
        if: ${{ inputs.run-shellcheck }}
        env:
          PATHS: ${{ inputs.shellcheck-paths }}
        run: |
          if [ -n "$PATHS" ]; then
            # shellcheck disable=SC2086
            shellcheck $PATHS
          else
            mapfile -t FILES < <(find . -path ./.git -prune -o -name '*.sh' -print)
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "沒有 .sh 檔，略過"; exit 0
            fi
            printf '檢查：%s\n' "${FILES[@]}"
            shellcheck "${FILES[@]}"
          fi

  # PR 來源分支政策：擋下「從不該來的分支發 PR 到受管制的 base」。
  #
  # 典型用法是 develop 流程 —— 功能分支只能發 PR 到 develop，
  # 而 main 只接受 develop 的 PR。但公版不寫死任何分支名稱：
  # 要管哪些 base、允許哪些來源，全由呼叫端用兩個 input 決定，沒填就整個不啟用。
  #
  # 為什麼放在 CI 裡而不是另開一支 workflow：它的結果會被 ci-gate 收進去，
  # 而 `ci / CI Gate` 本來就是 required check —— 專案端的 ruleset 一個字都不用改。
  #
  # ⚠️ 改 base 的漏洞（2.0.0 修）：PR 先發到 develop 拿到綠燈，再到網頁上把 base 改成 main，
  # 預設的 pull_request 事件不會重跑，同一個 head SHA 上的綠燈就直接滿足 required check。
  # 呼叫端的 pull_request.types 要有 edited（範本已附），這個 job 才會在改 base 時重新判定。
  #
  # ⚠️ 這是「擋得住誤操作」，不是「擋得住惡意」。而且只有在能設分支保護的 repo，
  # 紅燈才真的擋得住 merge；沒有分支保護的 repo，它只是一個看得到的紅燈（見 README）。
  branch-policy:
    name: PR source branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ github.event_name == 'pull_request' && inputs.restricted-base-branches != '' }}
    steps:
      - name: Check PR source branch
        env:
          # 一律先過 env 再進 shell，不要把 ${{ }} 直接塞進 run: 字串（shell injection）
          BASES: ${{ inputs.restricted-base-branches }}
          ALLOWED: ${{ inputs.allowed-head-branches }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # 樣式是拿來給 case 比對的 glob，不是檔名 —— 關掉檔名展開，
          # 否則 `release/*` 在工作目錄剛好有 release/ 時會被展開成實際檔名。
          set -f

          # glob 比對：把「空白隔開的樣式」逐一拿去 case 比對。
          # 用 case 而不是 [[ ]]，是為了讓樣式來自變數時仍然當 glob 解讀。
          matches() {
            _value="$1"; _patterns="$2"
            for _p in $_patterns; do
              # shellcheck disable=SC2254  # 故意讓 $_p 展開成 glob 樣式
              case "$_value" in
                $_p) return 0 ;;
              esac
            done
            return 1
          }

          if ! matches "$BASE_REF" "$BASES"; then
            echo "✅ base 分支 \`$BASE_REF\` 不在管制清單（$BASES）內，不檢查來源" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🔀 PR 來源分支政策"
            echo ""
            echo "| 項目 | 值 |"
            echo "| --- | --- |"
            echo "| 目標分支（base） | \`$BASE_REF\` |"
            echo "| 來源分支（head） | \`$HEAD_REF\` |"
            echo "| 受管制的 base | \`$BASES\` |"
            echo "| 允許的來源 | \`${ALLOWED:-<空白>}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # 設定錯誤要吵，不要安靜放行：管了 base 卻沒列允許來源＝任何 PR 都進不去，
          # 那幾乎一定是漏填而不是本意。
          if [ -z "$ALLOWED" ]; then
            echo "::error::restricted-base-branches 有設 \`$BASES\`，但 allowed-head-branches 是空的 —— 這樣不會有任何 PR 能合併進去，請補上允許的來源分支"
            echo "❌ 設定錯誤：allowed-head-branches 未設定" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # fork 的分支名稱可以隨便取，叫 develop 不代表是這個 repo 的 develop。
          # 受管制的 base 一律不接 fork 的 PR —— 外部貢獻請發到不受管制的整合分支。
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::這個 PR 來自 fork（$HEAD_REPO），不能直接合併進受管制的 \`$BASE_REF\`。請改發到整合分支。"
            echo "❌ 來自 fork 的 PR 不得合併進 \`$BASE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if matches "$HEAD_REF" "$ALLOWED"; then
            echo "✅ \`$HEAD_REF\` 允許合併進 \`$BASE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::\`$HEAD_REF\` 不能直接發 PR 到 \`$BASE_REF\`。允許的來源只有：$ALLOWED"
          {
            echo "❌ **\`$HEAD_REF\` 不能直接合併進 \`$BASE_REF\`**"
            echo ""
            echo "允許的來源分支：\`$ALLOWED\`"
            echo ""
            echo "請把這個 PR 的 base 改成整合分支（PR 頁面 Edit → base 下拉選單），"
            echo "等它合併進整合分支之後，再由整合分支發 PR 過來。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # 總結：分支保護「只需要要求 ci / CI Gate 這一個」status check。
  # 不要把 docker-build 之類的直接設成 required —— 它們有 if 條件，關掉時會 skipped，
  # 而 skipped 的 required check 要嘛被 GitHub 當通過（等於沒檢查）、要嘛永遠 pending，
  # 兩種都不是你要的。
  # 未來 ci-reusable 新增 job 時，記得加進下面的 needs（否則那個 job 形同虛設）。
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [python, dotnet, docker-build, lint, branch-policy]
    if: ${{ always() }}
    steps:
      - name: Evaluate all CI results
        env:
          PYTHON: ${{ needs.python.result }}
          DOTNET: ${{ needs.dotnet.result }}
          DOCKER: ${{ needs.docker-build.result }}
          LINT: ${{ needs.lint.result }}
          POLICY: ${{ needs.branch-policy.result }}
          # 每個檢查「是否應該要跑」——判斷通過與否的關鍵，見下方說明
          RUN_PYTHON: ${{ inputs.run-python }}
          RUN_DOTNET: ${{ inputs.run-dotnet }}
          RUN_DOCKER: ${{ inputs.run-docker-build }}
          RUN_LINT: ${{ inputs.run-actionlint || inputs.run-shellcheck }}
          RUN_POLICY: ${{ github.event_name == 'pull_request' && inputs.restricted-base-branches != '' }}
        run: |
          {
            echo "## 🧪 CI Gate 結果"
            echo ""
            echo "| 檢查 | 啟用 | 結果 |"
            echo "| --- | --- | --- |"
            echo "| Python lint + test | $RUN_PYTHON | $PYTHON |"
            echo "| .NET build + test | $RUN_DOTNET | $DOTNET |"
            echo "| Docker build check（含 hadolint） | $RUN_DOCKER | $DOCKER |"
            echo "| Workflow + shell lint (actionlint, shellcheck) | $RUN_LINT | $LINT |"
            echo "| PR source branch policy | $RUN_POLICY | $POLICY |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0

          # 判定原則：**開了就必須是 success**；只有沒開時才允許非 success。
          #
          # 為什麼不能只擋 failure / cancelled（2026-08-06 實測遇到）：
          # runner 排隊過久被 GitHub 取消時，那些 job 的 conclusion 是 cancelled，
          # 但傳進 needs.<job>.result 的值並不是 cancelled ——
          # 舊寫法（只擋 failure|cancelled）因此判定通過，Gate 回報 success，
          # 而那次 actionlint 與 shellcheck 根本一行都沒執行。
          # 分支保護只認這個 Gate，等於「沒跑到」被當成「通過」，required check 形同虛設。
          #
          # 所以這裡改成白名單：該跑的就得拿到 success，其他一律擋。
          assert_job() {
            local name="$1" enabled="$2" result="$3"
            if [ "$enabled" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "❌ **$name** 已啟用，但結果是 \`${result:-<空值>}\`（需要 success）" >> "$GITHUB_STEP_SUMMARY"
                FAIL=1
              fi
            else
              case "$result" in
                failure|cancelled)
                  echo "❌ **$name** 未啟用，結果卻是 \`$result\`" >> "$GITHUB_STEP_SUMMARY"
                  FAIL=1
                  ;;
              esac
            fi
          }

          assert_job "Python lint + test"     "$RUN_PYTHON" "$PYTHON"
          assert_job ".NET build + test"      "$RUN_DOTNET" "$DOTNET"
          assert_job "Docker build check"     "$RUN_DOCKER" "$DOCKER"
          assert_job "Workflow + shell lint"  "$RUN_LINT"   "$LINT"
          assert_job "PR source branch policy" "$RUN_POLICY" "$POLICY"

          if [ "$FAIL" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ CI Gate 未通過" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ CI Gate 通過" >> "$GITHUB_STEP_SUMMARY"

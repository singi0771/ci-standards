# 中央「公版」CI Reusable Workflow（Python + Docker）
# 各專案用一行 uses: 呼叫；統一 lint + test + Docker build 檢查。
name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      run-docker-build:
        description: "是否驗證 Docker image 能建置"
        type: boolean
        default: true
      ruff-version:
        description: "釘死的 ruff 版本，避免 lint 隨新版 ruff 漂移（要升級在此改）"
        type: string
        default: "0.16.0"

permissions:
  contents: read

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # ruff 釘版本：不釘的話新版 ruff 會憑空多出 lint 規則，讓沒改碼的 repo 突然變紅
          pip install "ruff==${{ inputs.ruff-version }}" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.run-docker-build }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image (不推送，只驗證能 build)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ci-check:${{ github.sha }} .
          else
            echo "沒有 Dockerfile，略過"
          fi

  # 彙總守門員：分支保護「只需要求 ci / CI Gate 這一個」status check。
  # 不要把 docker-build 直接設成 required —— 它有 if 條件，run-docker-build=false 時
  # 會變 skipped、required check 永遠不回報 → PR 永久卡住。
  # 未來 ci-reusable 新增 job 時，記得加進下面的 needs（否則該 job 形同虛設）。
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python, docker-build]
    if: ${{ always() }}
    steps:
      - name: Evaluate all CI results
        run: |
          PYTHON="${{ needs.python.result }}"
          DOCKER="${{ needs.docker-build.result }}"
          {
            echo "## 🧪 CI Gate 結果"
            echo ""
            echo "| 檢查 | 結果 |"
            echo "| --- | --- |"
            echo "| Python lint + test | $PYTHON |"
            echo "| Docker build check | $DOCKER |"
          } >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          [ "$PYTHON" != "success" ] && FAIL=1
          # docker-build 允許 skipped（run-docker-build=false）；只有 failure 才擋
          [ "$DOCKER" = "failure" ] && FAIL=1
          if [ "$FAIL" = "1" ]; then
            echo "❌ CI Gate 未通過" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ CI Gate 通過" >> "$GITHUB_STEP_SUMMARY"

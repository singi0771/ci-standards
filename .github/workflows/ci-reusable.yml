# 中央公版：CI Reusable Workflow（Python + Docker + workflow / shell lint）
# 各專案用一行 uses: 呼叫；統一 lint + test + Docker build 檢查。
#
# 省 Actions 分鐘的設計（GitHub 每個 job 都是「不滿一分鐘也算一分鐘」）：
#   - actionlint 與 shellcheck 合成一個 job（兩個加起來不到 30 秒，拆兩個 job 白付一分鐘）
#   - hadolint 放在 Docker build 那個 job 裡當一個步驟，不另開 job
#   - actionlint 改抓 2 MB 的執行檔，不再拉 docker image（省 20–40 秒）
name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      run-python:
        description: "是否跑 Python lint + test（非 Python 專案設 false）"
        type: boolean
        default: true
      run-docker-build:
        description: "是否驗證 Docker image 能建置"
        type: boolean
        default: true
      run-hadolint:
        description: "build 之前是否先用 hadolint 檢查 Dockerfile 寫法（要 run-docker-build 開著、且專案有 Dockerfile 才有作用）"
        type: boolean
        default: false
      run-actionlint:
        description: "是否檢查 GitHub Actions workflow 語法（會連 run: 區塊裡的 bash 一起用 shellcheck 檢查）"
        type: boolean
        default: false
      run-shellcheck:
        description: "是否用 shellcheck 檢查 shell script"
        type: boolean
        default: false
      shellcheck-paths:
        description: "要檢查的 shell script glob（空字串＝自動找全 repo 的 *.sh）"
        type: string
        default: ""
      actionlint-paths:
        description: "額外要檢查的 workflow 檔（空字串＝只檢查本 repo 的 .github/workflows）"
        type: string
        default: ""
      ruff-version:
        description: "釘死的 ruff 版本，避免 lint 結果隨新版 ruff 漂移（要升級在這裡改）"
        type: string
        default: "0.16.0"

permissions:
  contents: read

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.run-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 這個 job 不會推東西回 repo，不要把 token 留在磁碟上（zizmor: artipacked）
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
      - name: Install deps
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          # ruff 釘版本：不釘的話新版 ruff 會憑空多出 lint 規則，讓沒改程式的 repo 突然變紅
          # （runner 的 pip 已經夠新，不必再花 10 秒 upgrade pip）
          pip install "ruff==$RUFF_VERSION" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: |
          set +e
          pytest -q
          EXIT=$?
          set -e
          # pytest 的 exit 5 = 「沒收集到任何測試」。還沒開始寫測試的專案不該因此
          # 永遠紅著（那只會逼人把 CI 關掉）。真正的測試失敗是 exit 1，照樣擋。
          if [ "$EXIT" -eq 5 ]; then
            echo "⚠️  沒有找到任何測試 —— 通過，但這個專案應該補上測試。"
            echo "⚠️ 沒有任何測試" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXIT" -ne 0 ]; then
            exit "$EXIT"
          fi

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.run-docker-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hadolint：檢查 Dockerfile 的寫法（沒釘版本的 apt 套件、用 latest tag、
      # RUN 裡的 shell 問題…）。Trivy 的 misconfig 只抓「會出資安問題」的那幾條，
      # hadolint 抓得更廣。放在 build 前面：Dockerfile 寫壞了不必等 build 跑完才知道。
      - name: Dockerfile lint (hadolint)
        if: ${{ inputs.run-hadolint && hashFiles('Dockerfile') != '' }}
        run: |
          # 版本 + sha256 一起釘，升版時到 release 的 checksums.sha256 重抓：
          # https://github.com/hadolint/hadolint/releases
          VERSION="2.15.1"
          SHA256="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
          curl --fail -sSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/hadolint-linux-x86_64"
          echo "${SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint && sudo mv hadolint /usr/local/bin/hadolint
          hadolint --version
          # warning 以上才算失敗；info / style 只印出來。要忽略某條規則放 .hadolint.yaml 在專案根目錄。
          hadolint --failure-threshold warning Dockerfile
      - name: Build image (不推送，只驗證能 build)
        env:
          # 一律先過 env 再進 shell，不要把 ${{ }} 直接塞進 run: 字串（shell injection）
          SHA: ${{ github.sha }}
        run: |
          if [ -f Dockerfile ]; then
            docker build -t "ci-check:$SHA" .
          else
            echo "沒有 Dockerfile，略過"
          fi

  # workflow 語法 + shell script 檢查，合在一個 job（見檔頭「省分鐘」說明）。
  # actionlint 會自動呼叫 PATH 上的 shellcheck 去檢查 run: 區塊，ubuntu runner 內建 shellcheck，
  # 所以不必再拉 docker image。
  lint:
    name: Workflow + shell lint (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.run-actionlint || inputs.run-shellcheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        if: ${{ inputs.run-actionlint }}
        env:
          EXTRA_PATHS: ${{ inputs.actionlint-paths }}
        run: |
          # 版本 + sha256 一起釘，理由同其他工具：latest 升版會新增規則，沒改程式也可能突然變紅。
          # 升版時到 release 的 actionlint_<版本>_checksums.txt 重抓：https://github.com/rhysd/actionlint/releases
          VERSION="1.7.12"
          SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version | head -2

          # 不帶檔案參數時 actionlint 會自動掃 .github/workflows；
          # 一旦給了檔案參數就「只」檢查那些檔案，所以額外路徑必須分開跑一次。
          actionlint -color

          if [ -n "$EXTRA_PATHS" ]; then
            # shellcheck disable=SC2086  # 要讓 glob / 多路徑展開成多個參數
            actionlint -color $EXTRA_PATHS
          fi
      - name: Run shellcheck
        if: ${{ inputs.run-shellcheck }}
        env:
          PATHS: ${{ inputs.shellcheck-paths }}
        run: |
          if [ -n "$PATHS" ]; then
            # shellcheck disable=SC2086
            shellcheck $PATHS
          else
            mapfile -t FILES < <(find . -path ./.git -prune -o -name '*.sh' -print)
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "沒有 .sh 檔，略過"; exit 0
            fi
            printf '檢查：%s\n' "${FILES[@]}"
            shellcheck "${FILES[@]}"
          fi

  # 總結：分支保護「只需要要求 ci / CI Gate 這一個」status check。
  # 不要把 docker-build 之類的直接設成 required —— 它們有 if 條件，關掉時會 skipped，
  # 而 skipped 的 required check 要嘛被 GitHub 當通過（等於沒檢查）、要嘛永遠 pending，
  # 兩種都不是你要的。
  # 未來 ci-reusable 新增 job 時，記得加進下面的 needs（否則那個 job 形同虛設）。
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [python, docker-build, lint]
    if: ${{ always() }}
    steps:
      - name: Evaluate all CI results
        env:
          PYTHON: ${{ needs.python.result }}
          DOCKER: ${{ needs.docker-build.result }}
          LINT: ${{ needs.lint.result }}
          # 每個檢查「是否應該要跑」——判斷通過與否的關鍵，見下方說明
          RUN_PYTHON: ${{ inputs.run-python }}
          RUN_DOCKER: ${{ inputs.run-docker-build }}
          RUN_LINT: ${{ inputs.run-actionlint || inputs.run-shellcheck }}
        run: |
          {
            echo "## 🧪 CI Gate 結果"
            echo ""
            echo "| 檢查 | 啟用 | 結果 |"
            echo "| --- | --- | --- |"
            echo "| Python lint + test | $RUN_PYTHON | $PYTHON |"
            echo "| Docker build check（含 hadolint） | $RUN_DOCKER | $DOCKER |"
            echo "| Workflow + shell lint (actionlint, shellcheck) | $RUN_LINT | $LINT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0

          # 判定原則：**開了就必須是 success**；只有沒開時才允許非 success。
          #
          # 為什麼不能只擋 failure / cancelled（2026-08-06 實測遇到）：
          # runner 排隊過久被 GitHub 取消時，那些 job 的 conclusion 是 cancelled，
          # 但傳進 needs.<job>.result 的值並不是 cancelled ——
          # 舊寫法（只擋 failure|cancelled）因此判定通過，Gate 回報 success，
          # 而那次 actionlint 與 shellcheck 根本一行都沒執行。
          # 分支保護只認這個 Gate，等於「沒跑到」被當成「通過」，required check 形同虛設。
          #
          # 所以這裡改成白名單：該跑的就得拿到 success，其他一律擋。
          assert_job() {
            local name="$1" enabled="$2" result="$3"
            if [ "$enabled" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "❌ **$name** 已啟用，但結果是 \`${result:-<空值>}\`（需要 success）" >> "$GITHUB_STEP_SUMMARY"
                FAIL=1
              fi
            else
              case "$result" in
                failure|cancelled)
                  echo "❌ **$name** 未啟用，結果卻是 \`$result\`" >> "$GITHUB_STEP_SUMMARY"
                  FAIL=1
                  ;;
              esac
            fi
          }

          assert_job "Python lint + test"     "$RUN_PYTHON" "$PYTHON"
          assert_job "Docker build check"     "$RUN_DOCKER" "$DOCKER"
          assert_job "Workflow + shell lint"  "$RUN_LINT"   "$LINT"

          if [ "$FAIL" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ CI Gate 未通過" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ CI Gate 通過" >> "$GITHUB_STEP_SUMMARY"

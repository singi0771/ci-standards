# ┌─────────────────────────────────────────────────────────────────┐
# │  中央「公版」安全掃描 Reusable Workflow（DevSecOps / Shift-left）    │
# │  各專案用一行 uses: 呼叫。全部免費開源工具。                          │
# │  預設「job 成敗當守門員 + artifact」，私有 repo 無需 GHAS 也能跑；     │
# │  若該 repo 有 GHAS 或為 public，可用 upload-sarif=true 把結果寫進     │
# │  Security 分頁（code scanning）。                                    │
# └─────────────────────────────────────────────────────────────────┘
name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      python-version:
        description: "掃描環境用的 Python 版本"
        type: string
        default: "3.12"
      severity:
        description: "要擋下的嚴重度（Trivy / 影像掃描）"
        type: string
        default: "CRITICAL,HIGH"
      fail-on-findings:
        description: "掃到問題時是否讓 CI 失敗（true=守門員 / false=只回報）"
        type: boolean
        default: true
      scan-docker-image:
        description: "若專案有 Dockerfile，是否 build 出 image 再掃描其弱點"
        type: boolean
        default: false
      upload-sarif:
        description: "是否把結果上傳到 Security 分頁（僅 public repo 或有 GHAS 的 private repo 適用）"
        type: boolean
        default: false

permissions:
  contents: read
  # 預設「不」要求 security-events: write，這樣 upload-sarif=false（預設）在任何 repo
  # （含 token 為唯讀的 private repo）都能正常啟動。
  # 若要 upload-sarif=true（public 或有 GHAS 的 repo），呼叫端的 job 需自行加上：
  #   permissions:
  #     contents: read
  #     security-events: write
  # 且該 repo 的 Actions workflow 權限要允許寫入 security-events。

jobs:
  # 1) SAST 靜態程式碼弱點（免費取代私有 repo 的 CodeQL）
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # 釘版本：不釘（＝latest）等於每次跑都可能吃到新規則，讓沒改碼的 repo 突然變紅，
      # 也是供應鏈風險。要升級規則就在這裡改一版、統一生效。
      image: semgrep/semgrep:1.171.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan (OWASP Top 10 + security-audit + auto)
        continue-on-error: ${{ inputs.fail-on-findings == false }}
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --config auto \
            --error --sarif --output=semgrep.sarif
      - name: Upload SARIF to Security tab
        # always() 是刻意的：semgrep 用 --error，掃到問題時「這一步就是 failed」。
        # 拿掉它的話後續步驟會被 GitHub 跳過 —— 變成「只有什麼都沒掃到才上傳報告」，
        # 最需要報告的時候反而不傳。（2026-08-09 PR #15 一度改錯成這樣。）
        #
        # hashFiles 才是原本 review 想解的問題：semgrep 若在寫出 SARIF 前就崩潰，
        # 這裡安靜跳過，而不是讓 upload 找不到檔案而讓整個 job 變紅。
        # 下面的 artifact 步驟用 if-no-files-found: ignore 達成同一件事。
        if: ${{ always() && inputs.upload-sarif && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload SARIF as artifact
        if: ${{ always() && !inputs.upload-sarif }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # 2) 相依套件弱點（比對 OSV 弱點資料庫）
  osv-scanner:
    name: Dependency vuln (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner
        run: |
          # --fail 很重要：沒有它，GitHub 回 404/5xx 時 curl 會把錯誤頁面存成「執行檔」，
          # 後面執行失敗又被當成良性 warning 放行 → 相依弱點掃描靜默失效、Gate 照樣綠燈。
          curl --fail -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          # 再驗一次真的是可執行的 osv-scanner，才往下跑
          osv-scanner --version
      - name: Run OSV-Scanner
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set +e
          OUT=$(osv-scanner --recursive ./ 2>&1)
          EXIT=$?
          set -e
          echo "$OUT"
          # deps.dev 端故障（rpc Internal）時，manifest 的間接依賴解析會失敗，
          # osv-scanner 即使實際弱點為 0 也以非零收場 —— 2026-08-08 起連續兩天
          # 讓所有 PR 全紅過。這種情況退回 --no-resolve 重掃一次：
          # 直接依賴照掃、間接依賴本次略過，並以 warning 明示涵蓋率降級，
          # 不是靜默放行（若 --no-resolve 那輪掃到弱點，仍照常擋下）。
          # 只在「第一輪弱點數為 0、純粹是解析錯誤」時才 fallback。
          # 第一輪若已掃出弱點，不得讓視野較窄（略過間接依賴）的第二輪蓋過
          # 結果變綠 —— 那正是 review 指出的 masking 風險。
          if [ "$EXIT" -ne 0 ] && echo "$OUT" | grep -q "failed resolution.*rpc error" \
             && ! echo "$OUT" | grep -qE "Total [1-9][0-9]* packages? affected"; then
            echo "::warning::deps.dev 依賴解析服務故障（第一輪弱點數 0），改以 --no-resolve 重掃（本輪不含 manifest 間接依賴弱點）"
            set +e
            osv-scanner --recursive --no-resolve ./
            EXIT=$?
            set -e
          fi
          if [ "$EXIT" -eq 0 ]; then
            echo "✅ No vulnerabilities found."
          elif [ "$EXIT" -eq 1 ]; then
            echo "❌ Vulnerabilities found!"
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then exit 1; fi
          elif [ "$EXIT" -eq 128 ]; then
            # 128 = osv-scanner 找不到任何可掃的 lockfile/manifest，不是弱點
            echo "⚠️  No supported lockfile found — nothing to scan."
          else
            # 其餘（含 127）一律視為「掃描沒跑成功」而擋下。
            #
            # 行為變更說明：舊版把 127 當良性 warning 放行（見 commit 22b1317）。但 127 是
            # command-not-found，最可能的成因其實是上一步下載失敗——那正是「掃描靜默失效
            # 卻依然綠燈」的漏洞。現在安裝步驟已用 --fail + --version 驗過執行檔，走到這裡
            # 代表 scanner 真的出錯、這次沒掃成，不能當作通過。
            # 若確認是 osv-scanner 自己對某種 transitive dep 的已知問題，請針對該情況加白名單，
            # 不要把整個 else 改回放行。
            echo "❌ OSV-Scanner 異常結束（exit $EXIT）— 視為掃描失敗。"
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then exit 1; fi
          fi

  # 3) 檔案系統 + Dockerfile + IaC 設定弱點 + 內嵌密鑰
  trivy:
    name: FS / IaC / Docker (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy scan
        continue-on-error: ${{ inputs.fail-on-findings == false }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          severity: ${{ inputs.severity }}
          exit-code: "1"

  # 4) 密鑰外洩掃描（用 docker 執行檔，避開 gitleaks-action 對組織帳號的 license 要求）
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks (free, no license)
        continue-on-error: ${{ inputs.fail-on-findings == false }}
        run: |
          # 釘版本，理由同 semgrep：latest 升版會新增規則，沒改碼也可能突然變紅。
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=. --redact --no-banner --exit-code=1

  # 5) （可選）Docker image 弱點掃描：有 Dockerfile 且 scan-docker-image=true 才跑
  trivy-image:
    name: Docker image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.scan-docker-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (不推送，只為掃描)
        env:
          SHA: ${{ github.sha }}
        run: |
          if [ -f Dockerfile ]; then
            docker build -t "scan-target:$SHA" .
          else
            echo "沒有 Dockerfile，略過"; exit 0
          fi
      - name: Scan image
        if: ${{ hashFiles('Dockerfile') != '' }}
        continue-on-error: ${{ inputs.fail-on-findings == false }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: scan-target:${{ github.sha }}
          format: table
          severity: ${{ inputs.severity }}
          # 只擋「上游已有修補版本」的 CVE。base image（Debian/Alpine）長期帶著十幾個
          # 上游還沒修的 HIGH，擋了你也改不掉，只會逼大家把 fail-on-findings 關掉、
          # 整套守門一起廢掉。要看完整清單就把 ignore-unfixed 設成 false。
          ignore-unfixed: true
          exit-code: "1"

  # 6) 彙總守門員：needs 所有掃描，讓分支保護「只需要求這一個」status check。
  #    任何一項掃描失敗，這個 gate 就失敗 → PR 無法 merge。
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [semgrep, osv-scanner, trivy, gitleaks, trivy-image]
    if: ${{ always() }}
    steps:
      - name: Evaluate all scan results
        env:
          SEMGREP: ${{ needs.semgrep.result }}
          OSV: ${{ needs.osv-scanner.result }}
          TRIVY: ${{ needs.trivy.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          IMAGE: ${{ needs.trivy-image.result }}
          SCAN_IMAGE: ${{ inputs.scan-docker-image }}
        run: |
          {
            echo "## 🛡️ Security Gate 結果"
            echo ""
            echo "| 掃描 | 結果 |"
            echo "| --- | --- |"
            echo "| SAST (Semgrep) | $SEMGREP |"
            echo "| Dependency (OSV) | $OSV |"
            echo "| FS/IaC (Trivy) | $TRIVY |"
            echo "| Secret (gitleaks) | $GITLEAKS |"
            echo "| Docker image (Trivy) | $IMAGE（啟用：$SCAN_IMAGE） |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0

          # 這四項沒有 if 條件，一定會跑 —— 所以「不是 success 就擋」。
          # 這個白名單寫法是對的：不只擋 failure，連 cancelled、skipped、
          # 以及 runner 沒排到而拿不到結果的情況，全部都擋。
          for r in "$SEMGREP" "$OSV" "$TRIVY" "$GITLEAKS"; do
            if [ "$r" != "success" ]; then
              echo "❌ 有掃描的結果是 \`${r:-<空值>}\`（需要 success）" >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
            fi
          done

          # Docker image 掃描是可選的，判定原則跟 CI Gate 一致：
          # **啟用了就必須 success**，沒啟用才允許 skipped。
          # 舊寫法只擋 failure —— 那樣的話 scan-docker-image=true 但 job 被取消時，
          # 掃描沒跑成 Gate 卻放行，等於「沒跑到」被當成「通過」。
          if [ "$SCAN_IMAGE" = "true" ]; then
            if [ "$IMAGE" != "success" ]; then
              echo "❌ Docker image 掃描已啟用，但結果是 \`${IMAGE:-<空值>}\`（需要 success）" >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
            fi
          else
            case "$IMAGE" in
              failure|cancelled)
                echo "❌ Docker image 掃描未啟用，結果卻是 \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
                FAIL=1
                ;;
            esac
          fi

          if [ "$FAIL" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Security Gate 未通過（有掃描失敗、沒跑成，或發現高風險問題）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Security Gate 通過" >> "$GITHUB_STEP_SUMMARY"

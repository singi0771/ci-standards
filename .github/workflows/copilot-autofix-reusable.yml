# 中央「公版」Reusable：CI/Security 失敗時請 Copilot Coding Agent 自動修。
# consumer 端只放一支 workflow_run 觸發的薄殼，用一行 uses: 呼叫本檔並傳入事件參數。
# 邏輯集中在這裡；改動只要移動 tag，各專案下次觸發即反應式同步。
name: Reusable — Copilot Autofix (CI/Security)

on:
  workflow_call:
    inputs:
      head-branch:
        description: "失敗 workflow 的分支（github.event.workflow_run.head_branch）"
        type: string
        required: true
      workflow-name:
        description: "失敗的 workflow 名稱（CI / Security Scan）"
        type: string
        required: true
      run-id:
        description: "失敗 run 的 id，用來抓失敗 job 名"
        type: string
        required: true
      run-url:
        description: "失敗 run 的 html_url，貼在留言裡"
        type: string
        required: true
      max-attempts:
        description: "每個 PR 自動修正次數上限"
        type: string
        default: "3"

permissions:
  pull-requests: write
  issues: write     # 貼 needs-human-review label 需要（label API 屬於 Issues 權限）
  contents: read
  actions: read

jobs:
  request-copilot-fix:
    name: Ask Copilot Agent to Fix Failures
    runs-on: ubuntu-latest
    steps:
      - name: Find open PR and author
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass context values through env to prevent shell injection
          HEAD_BRANCH: ${{ inputs.head-branch }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="$HEAD_BRANCH"
          PR_NUM=$(gh pr list \
            --repo "$GH_REPO" \
            --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          PR_AUTHOR=$(gh pr list \
            --repo "$GH_REPO" \
            --head "$BRANCH" --state open \
            --json author --jq '.[0].author.login // empty')

          # Dependabot PR 由 Dependabot 自行管理，不走 Copilot agent auto-fix 流程
          if [[ "$PR_AUTHOR" == "app/dependabot" || "$PR_AUTHOR" == *"dependabot"* ]]; then
            echo "Dependabot PR — skipping auto-fix (Dependabot manages its own PRs)."
            PR_NUM=""
          fi

          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "author=$PR_AUTHOR" >> "$GITHUB_OUTPUT"
          [ -z "$PR_NUM" ] && echo "Skipping (no open PR or Dependabot PR)." \
                           || echo "PR #$PR_NUM by @$PR_AUTHOR"

      - name: Guard — check attempt count and cooldown
        id: guard
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MAX: ${{ inputs.max-attempts }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 計算已發出的 auto-fix 請求數（用隱藏 HTML marker 標記）
          # 一次抓完留言，後面全部就地過濾（省 API 呼叫，也避免三次查詢之間有新留言插進來）
          COMMENTS=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments")

          ATTEMPTS=$(echo "$COMMENTS" \
            | jq -s 'add | [.[] | select(.body | contains("<!-- auto-fix-attempt -->"))] | length')

          # Cooldown：同一個 commit 的 CI 和 Security 可能在數秒內相繼失敗
          # 15 分鐘內已有 fix request 就跳過，避免重複觸發兩次
          CUTOFF=$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          RECENT=$(echo "$COMMENTS" \
            | jq -s --arg cutoff "$CUTOFF" 'add | [.[]
                | select(.body | contains("<!-- auto-fix-attempt -->"))
                | select(.created_at >= $cutoff)] | length')

          # 已經升級過就不要再貼一次。升級留言本身不含 auto-fix-attempt marker，
          # 所以上面的 cooldown 擋不住它 —— 沒有這道檢查的話，達上限後「每一次」
          # CI 失敗都會再貼一則 🚨 並重新 @ 人，PR 會被洗版。
          ESCALATED=$(echo "$COMMENTS" \
            | jq -s 'add | [.[] | select(.body | contains("<!-- auto-fix-escalated -->"))] | length')

          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"

          if [ "$ESCALATED" -gt "0" ]; then
            echo "action=done" >> "$GITHUB_OUTPUT"
            echo "Already escalated to human — staying quiet."
          elif [ "$RECENT" -gt "0" ]; then
            echo "action=cooldown" >> "$GITHUB_OUTPUT"
            echo "Cooldown: fix request posted in last 15 min — skipping duplicate."
          elif [ "$ATTEMPTS" -ge "$MAX" ]; then
            echo "action=escalate" >> "$GITHUB_OUTPUT"
            echo "Limit reached ($ATTEMPTS/$MAX) — will escalate to human."
          else
            echo "action=fix" >> "$GITHUB_OUTPUT"
            echo "Attempt $((ATTEMPTS + 1))/$MAX — will request Copilot fix."
          fi

      - name: Get failed job names
        id: info
        if: ${{ steps.guard.outputs.action == 'fix' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ inputs.run-id }}
        run: |
          # 不要只挑 conclusion == "failure"：run 可能因為 job 被取消、逾時或
          # 啟動失敗而整體失敗，那時沒有任何 job 是 "failure"，清單會是空的，
          # 貼出去的留言就變成「CI 失敗，失敗的 jobs：（空白）」——對 Copilot 和人都沒用。
          # shellcheck disable=SC2016  # 單引號內是 jq 語法，本來就不該由 shell 展開
          FAILED=$(gh api "repos/$GH_REPO/actions/runs/$WORKFLOW_RUN_ID/jobs" \
            --jq '[.jobs[]
                   | select(.conclusion == "failure" or .conclusion == "cancelled"
                            or .conclusion == "timed_out" or .conclusion == "startup_failure")
                   | "- `" + .name + "`（" + .conclusion + "）"] | join("\n")')
          if [ -z "$FAILED" ]; then
            FAILED="- （沒有任何 job 被標記為失敗 —— 可能是 workflow 啟動失敗，或 runner 排隊過久被取消。請直接看上面的 run 畫面。）"
          fi
          {
            echo "failed<<EOF"
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Copilot fix request
        if: ${{ steps.guard.outputs.action == 'fix' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          RUN_URL: ${{ inputs.run-url }}
          FAILED_JOBS: ${{ steps.info.outputs.failed }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ATTEMPTS: ${{ steps.guard.outputs.attempts }}
          MAX: ${{ inputs.max-attempts }}
        run: |
          ATTEMPT=$(( ATTEMPTS + 1 ))
          BODY=$(printf '<!-- auto-fix-attempt -->\n🔴 **%s 失敗，自動修正中（第 %d/%s 次）**\n\n失敗的 jobs：\n%s\n\n詳細 log：%s\n\n@copilot 請分析上述失敗原因，直接修正程式碼並 commit 到本 PR 分支。修正後 CI 會自動重跑，不需手動觸發。若為安全掃描問題，請優先以修改程式碼解決，避免使用 ignore 規則。' \
            "$WORKFLOW_NAME" "$ATTEMPT" "$MAX" "$FAILED_JOBS" "$RUN_URL")
          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "$BODY"

      - name: Escalate — max attempts reached, notify human
        if: ${{ steps.guard.outputs.action == 'escalate' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          WORKFLOW_NAME: ${{ inputs.workflow-name }}
          RUN_URL: ${{ inputs.run-url }}
          MAX: ${{ inputs.max-attempts }}
        run: |
          BODY=$(printf '<!-- auto-fix-escalated -->\n🚨 **自動修正已達 %s 次上限，需要人工介入**\n\n@%s Copilot Agent 已嘗試自動修正 %s 次，但 **%s** 仍然失敗，自動循環已停止。\n\n最後失敗的 run：%s\n\n請人工排查並修正，或重新評估此 PR 的修正方向。\n\n> 本 PR 之後的 CI 失敗不會再自動留言。處理完想重啟自動修正，請刪掉這則留言。' \
            "$MAX" "$PR_AUTHOR" "$MAX" "$WORKFLOW_NAME" "$RUN_URL")
          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "$BODY"
          # 建立 label（若不存在則先建立）並貼到 PR
          gh label create "needs-human-review" \
            --color "#FF6B6B" \
            --description "Automated fix loop exhausted — manual intervention required" \
            --repo "$GH_REPO" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --add-label "needs-human-review" 2>/dev/null || true
